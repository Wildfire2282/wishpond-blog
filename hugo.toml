baseURL = "https://example.org/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "生成式许愿井"
theme = "wishpond"
enableRobotsTXT = true
hasCJKLanguage = true
disableKinds = ["rss"]

[module]
  [module.hugoVersion]
    min = "0.164.0"

[params]
  description = "记录软件工程、工具系统、学习札记与日常思考的个人博客。"
  tagline = "愿落深井 回响自来"

[taxonomies]
  topic = "topics"
  tag = "tags"

[permalinks]
  posts = "/posts/:slug/"

[outputs]
  home = ["HTML", "JSON"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[related]
  includeNewer = true
  threshold = 60
  toLower = true

  [[related.indices]]
    name = "topics"
    weight = 100

  [[related.indices]]
    name = "tags"
    weight = 80

  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.parser]
    autoIDType = "github-ascii"
  [markup.goldmark.renderer]
    unsafe = false

[pagination]
  pagerSize = 10

[menus]
  [[menus.main]]
    name = "主题"
    pageRef = "/topics"
    weight = 10
  [[menus.main]]
    name = "标签"
    pageRef = "/tags"
    weight = 20
  [[menus.main]]
    name = "归档"
    pageRef = "/archives"
    weight = 30
  [[menus.main]]
    name = "搜索"
    pageRef = "/search"
    weight = 40
